name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Full build & test matrix across all platforms with stable Rust
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build

      - name: cargo build --all-features
        run: cargo build --all-features

      - name: cargo test
        run: cargo test

      - name: cargo test --all-features
        run: cargo test --all-features

      - name: cargo clippy --all-features
        run: cargo clippy --all-features -- -D warnings

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features

  # ---------------------------------------------------------------------------
  # MSRV (Minimum Supported Rust Version) check
  # Only verifies that the library itself compiles with Rust 1.75.
  # Tests, benches, and examples are allowed to use newer features.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV (1.75.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.75.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: cargo check --lib (MSRV 1.75)
        run: cargo +1.75.0 check --lib --all-features

  # ---------------------------------------------------------------------------
  # Formatting check
  # ---------------------------------------------------------------------------
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: cargo fmt --check
        run: cargo fmt -- --check
