name: CI

on:
  push:
    branches: [main, master, develop/*]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Full build & test matrix across all platforms with stable Rust
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build

      - name: cargo build --all-features
        run: cargo build --all-features

      - name: cargo test
        run: cargo test

      - name: cargo test --all-features
        run: cargo test --all-features

      - name: cargo clippy --all-features
        run: cargo clippy --all-features -- -D warnings

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features

  # ---------------------------------------------------------------------------
  # MSRV (Minimum Supported Rust Version) check
  # Only verifies that the library itself compiles with Rust 1.75.
  # Tests, benches, and examples are allowed to use newer features.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV (1.75.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.75.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: cargo check --lib (MSRV 1.75)
        run: cargo +1.75.0 check --lib --all-features

  # ---------------------------------------------------------------------------
  # Formatting check
  # ---------------------------------------------------------------------------
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false

      - name: cargo fmt --check
        run: cargo fmt -- --check

  # ---------------------------------------------------------------------------
  # Feature flags matrix — Linux-only features (gso, gro, timestamping, etc.)
  # ---------------------------------------------------------------------------
  features-linux:
    name: features-linux (${{ matrix.feature-flags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-flags:
          - "--features gso"
          - "--features gro"
          - "--features gso,gro"
          - "--features timestamping"
          - "--features pktinfo"
          - "--features pacing"
          - "--features busy-poll"
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: features-linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            features-linux-cargo-
            ${{ runner.os }}-cargo-

      - name: cargo build ${{ matrix.feature-flags }}
        run: cargo build ${{ matrix.feature-flags }}

      - name: cargo test ${{ matrix.feature-flags }}
        run: cargo test ${{ matrix.feature-flags }}

      - name: cargo clippy ${{ matrix.feature-flags }}
        run: cargo clippy ${{ matrix.feature-flags }} -- -D warnings

  # ---------------------------------------------------------------------------
  # Feature flags matrix — cross-platform features (metrics, miri-safe, etc.)
  # ---------------------------------------------------------------------------
  features-cross:
    name: features-cross (${{ matrix.os }}, ${{ matrix.feature-flags }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        feature-flags:
          - "--features metrics"
          - "--features miri-safe"
          - "--features miri-safe,metrics"
          - "--all-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: features-cross-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            features-cross-cargo-
            ${{ runner.os }}-cargo-

      - name: cargo build ${{ matrix.feature-flags }}
        run: cargo build ${{ matrix.feature-flags }}

      - name: cargo test ${{ matrix.feature-flags }}
        run: cargo test ${{ matrix.feature-flags }}

      - name: cargo clippy ${{ matrix.feature-flags }}
        run: cargo clippy ${{ matrix.feature-flags }} -- -D warnings

  # ---------------------------------------------------------------------------
  # Miri — memory safety checking with nightly Rust
  # Tests with miri-safe and miri-safe+metrics feature combinations
  # ---------------------------------------------------------------------------
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: miri-cargo-

      - name: cargo miri setup
        run: cargo miri setup

      - name: cargo miri test (miri-safe)
        run: cargo miri test --features miri-safe --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: cargo miri test (miri-safe, metrics)
        run: cargo miri test --features "miri-safe,metrics" --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # ---------------------------------------------------------------------------
  # IPv6 tests — cross-platform, gracefully skips if IPv6 unavailable
  # ---------------------------------------------------------------------------
  ipv6:
    name: IPv6 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ipv6-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ipv6-cargo-
            ${{ runner.os }}-cargo-

      - name: Enable IPv6 on Linux runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0 || true

      - name: cargo test (IPv6)
        run: cargo test --test ipv6

  # ---------------------------------------------------------------------------
  # Stress tests — cross-platform, only on manual trigger or weekly schedule
  # ---------------------------------------------------------------------------
  stress:
    name: Stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: stress-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stress-cargo-
            ${{ runner.os }}-cargo-

      - name: cargo test (concurrent)
        run: cargo test --test concurrent

      - name: cargo test (boundary)
        run: cargo test --test boundary
