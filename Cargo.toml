[package]
name = "binger-udp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Cross-platform, batch-native UDP I/O with platform-optimal syscalls (sendmmsg/recvmmsg on Linux, GSO/GRO, and more)"
license = "MIT"
homepage = "https://github.com/wii1980/binger-udp"
repository = "https://github.com/wii1980/binger-udp"
documentation = "https://docs.rs/binger-udp"
keywords = ["udp", "batch", "sendmmsg", "recvmmsg", "networking"]
categories = ["network-programming", "asynchronous"]
exclude = [
    "docs/",
    "examples/",
    "tests/",
    ".github/",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "README_CN.md",
]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# FFI/syscall layer: pointer casts and integer narrowing are inherent to libc interop
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ptr_cast_constness = "allow"
borrow_as_ptr = "allow"

[features]
default = ["tokio"]

# --- Async Runtimes ---
tokio = ["dep:tokio"]

# --- Platform-Optimized Backends ---
# GSO: Generic Segmentation Offload — send one large datagram, kernel fragments it
# Faster than sendmmsg for single-destination batches (e.g., QUIC, KCP client)
gso = []

# GRO: Generic Receive Offload — kernel coalesces multiple incoming datagrams
# Faster than recvmmsg for single-socket receive
gro = []

# Busy-polling for ultra-low latency (SO_BUSY_POLL)
busy-poll = []

# Pacing / rate limiting (SO_MAX_PACING_RATE, requires fq qdisc)
pacing = []

# --- Observability ---
metrics = []

# --- Linux Advanced ---
# Timestamping: SO_TIMESTAMPNS + SCM_TIMESTAMPNS cmsg parsing in recv
timestamping = []

# Pktinfo: IP_PKTINFO / IPV6_RECVPKTINFO — destination address in recv
pktinfo = []

# --- Safety ---
# Miri-compatible mode: disables platform-specific unsafe, pure fallback only
miri-safe = []

[dependencies]
libc = "0.2"
thiserror = "2"
crossbeam-queue = "0.3"
bytes = { version = "1", features = ["serde"] }

tokio = { version = "1", features = ["net", "rt"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific: no extra deps needed (libc covers sendmmsg/recvmmsg)

[target.'cfg(target_os = "macos")'.dependencies]
# macOS: no extra deps (use private sendmsg_x/recvmsg_x via libc)

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
criterion = "0.5"
# clap-lex >=1.1.0 requires edition2024, which is not supported by Rust 1.75
clap_lex = ">=1.0, <1.1"
# clap >=4.6.0 also requires edition2024
clap = ">=4.0, <4.6"
rayon-core = ">=1.0, <1.13"

[[bench]]
name = "batch_bench"
harness = false
